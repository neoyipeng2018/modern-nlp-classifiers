[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finsent"
version = "0.1.0"
description = "Financial sentence sentiment classifiers, benched and released in the open"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3",
    "huggingface-hub>=0.25",
    "numpy>=1.26",
    "pandas>=2",
    "pyyaml>=6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
lexicon = ["pysentiment2>=0.1.1"]
dev = ["pytest>=8"]

[project.scripts]
finsent = "finsent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finsent = ["lexicons/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
